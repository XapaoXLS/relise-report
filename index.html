<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานค่าคอม/ค่ามือ — Relise Clinic</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Sukhumvit Set", "Thonburi", sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a2e;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }

  .card {
    background: #fff; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  input, select {
    padding: 10px 11px; border: 1px solid #ccc; border-radius: 8px;
    font-size: 16px; /* 16px กัน iOS ซูมตอนแตะช่องกรอก */
    font-family: inherit; width: 100%; background: #fff;
  }
  input[type=date] { width: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .row > div { min-width: 0; }
  button {
    padding: 10px 16px; border: 0; border-radius: 8px; font-size: 14px;
    font-family: inherit; cursor: pointer; background: #e3e6ea; white-space: nowrap;
    min-height: 42px;
  }
  button.primary { background: #2563eb; color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: #2563eb; }
  button.danger { background: transparent; color: #c0392b; }
  button.edit-btn { background: #e0eaff; color: #1d4ed8; font-weight: 600; min-height: 34px; padding: 7px 11px; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  #loginStatus, #status { font-size: 13px; margin-top: 10px; min-height: 18px; color: #666; }
  .err { color: #c0392b !important; }

  /* login */
  #loginView { max-width: 380px; margin: 8vh auto 0; padding: 0 16px; }
  #loginView .card { padding: 26px; }
  #loginView h1 { text-align: center; margin-bottom: 18px; }
  #loginView .field { margin-bottom: 14px; }
  #loginView button.primary { width: 100%; margin-top: 6px; }

  .userbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
  }
  .userbar .who { font-size: 15px; }
  .userbar .who b { font-size: 17px; }
  .rolechip {
    display: inline-block; background: #e0eaff; color: #2563eb;
    font-size: 11.5px; border-radius: 20px; padding: 2px 9px; margin-left: 4px;
  }

  /* ตารางเลื่อนแนวนอนได้บนจอแคบ แทนที่จะดันหน้าให้ล้น */
  .tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 7px 9px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #f0f2f5; font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; background: #f8fafc; border-top: 2px solid #ddd; }
  .daybar td { background: #eef4ff; font-weight: 600; }
  .dep { color: #b45309; }
  .warn { color: #c0392b; font-size: 12px; }
  .note { color: #666; font-size: 12.5px; margin-top: 8px; }
  .bill-list { min-width: 210px; }
  .bill-line + .bill-line { margin-top: 5px; padding-top: 5px; border-top: 1px dashed #e5e7eb; }
  .bill-meta { color: #666; font-size: 12px; }
  .statuschip {
    display: inline-block; border-radius: 20px; padding: 1px 7px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .statuschip.used { background: #dcfce7; color: #15803d; }
  .statuschip.pending { background: #fef3c7; color: #a16207; }
  .statuschip.unknown { background: #e5e7eb; color: #4b5563; }
  .section-title { font-size: 17px; margin: 0 0 4px; }
  .booking-tools {
    display: grid; grid-template-columns: minmax(240px, 1fr) minmax(160px, 220px);
    gap: 12px; align-items: end;
  }
  .booking-count { color: #555; font-size: 13px; margin-top: 10px; }
  .booking-help { color: #555; font-size: 13px; line-height: 1.55; margin-top: 10px; }
  .connected { color: #15803d; font-weight: 600; }
  .answer-cell { min-width: 170px; max-width: 220px; white-space: normal; }
  .answer-value {
    max-width: 200px; overflow: hidden; color: #64748b; font-size: 12px;
    line-height: 1.4; text-overflow: ellipsis; white-space: nowrap;
  }
  .answer-buttons { display: flex; gap: 5px; margin-top: 5px; }
  button.answer-action {
    min-height: 28px; padding: 4px 9px;
    background: #edf2ff; color: #1d4ed8; font-size: 12px; font-weight: 600;
  }
  button.read-answer { background: #e8f5ee; color: #147a45; }
  .answer-full {
    min-height: 130px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px;
    background: #f8fafc; color: #1e293b; font-size: 15px; line-height: 1.7;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  input[type=checkbox] { width: auto; }
  .slip-list { display: flex; flex-wrap: wrap; gap: 6px; min-width: 82px; }
  .slip-thumb {
    display: flex; width: 54px; height: 54px; align-items: center; justify-content: center;
    border: 1px solid #d8dde5; border-radius: 8px; overflow: hidden; background: #f8fafc;
    color: #2563eb; font-size: 12px; text-decoration: none;
  }
  .slip-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .attachment-editor { margin-top: 18px; padding-top: 16px; border-top: 1px solid #e5e7eb; }
  .attachment-list { display: grid; gap: 8px; margin: 8px 0 14px; }
  .attachment-item {
    display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px;
    align-items: center; padding: 8px; border: 1px solid #e5e7eb; border-radius: 9px;
  }
  .attachment-name { overflow-wrap: anywhere; font-size: 13px; }
  .check-label { display: flex; gap: 7px; align-items: center; color: #555; font-size: 13px; }
  .danger-check { color: #b42318; }
  dialog.booking-editor {
    width: min(760px, calc(100% - 24px)); max-height: calc(100vh - 30px);
    border: 0; border-radius: 14px; padding: 0; box-shadow: 0 24px 70px rgba(0,0,0,.28);
  }
  dialog.booking-editor::backdrop { background: rgba(15, 23, 42, .55); }
  .editor-head { padding: 18px 20px 12px; border-bottom: 1px solid #e5e7eb; }
  .editor-head h2 { margin: 0; font-size: 19px; }
  .editor-summary { color: #555; font-size: 13px; line-height: 1.55; margin-top: 6px; }
  .editor-body { padding: 18px 20px; overflow-y: auto; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .edit-grid .wide { grid-column: 1 / -1; }
  .edit-grid textarea { width: 100%; min-height: 94px; resize: vertical; padding: 10px 11px;
    border: 1px solid #ccc; border-radius: 8px; font: inherit; }
  .editor-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 18px; }
  .editor-message { min-height: 20px; font-size: 13px; margin-top: 12px; }

  .bignum { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .bignum .box {
    flex: 1; min-width: 130px; background: #f0f6ff; border-radius: 10px;
    padding: 12px 16px; text-align: center;
  }
  .bignum .box .v { font-size: 20px; font-weight: 700; color: #2563eb; }
  .bignum .box .l { font-size: 12px; color: #666; margin-top: 2px; }

  .report-title { display: none; }

  /* ====== มือถือ ====== */
  @media (max-width: 560px) {
    .wrap { padding: 12px; }
    #loginView { margin-top: 5vh; }
    #loginView .card { padding: 20px; }
    .card { padding: 14px; }
    h1 { font-size: 19px; }

    /* แถบควบคุม: วันที่เต็มแถว, ปุ่มเรียง 2 ต่อแถว */
    .row { gap: 10px; }
    .row > div { flex: 1 1 100%; }
    .row input[type=date] { width: 100%; }
    .row button { flex: 1 1 calc(50% - 5px); }
    .row button.primary { flex: 1 1 100%; order: 9; }

    /* กล่องสรุปตัวเลข 2 ต่อแถว */
    .bignum { gap: 10px; }
    .bignum .box { flex: 1 1 calc(50% - 5px); min-width: 0; padding: 10px 8px; }
    .bignum .box .v { font-size: 18px; }

    .userbar { align-items: flex-start; }
    .booking-tools { grid-template-columns: 1fr; }
    .edit-grid { grid-template-columns: 1fr; }
    .edit-grid .wide { grid-column: auto; }
    .attachment-item { grid-template-columns: 52px minmax(0, 1fr); }
    .attachment-item .check-label { grid-column: 1 / -1; }
    table { font-size: 13px; }
    th, td { padding: 6px 7px; }
  }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .card { box-shadow: none; padding: 0; }
    .wrap { max-width: 100%; padding: 0; }
    .report-title { display: block; margin-bottom: 10px; }
  }
</style>
</head>
<body>

<!-- ===== หน้า LOGIN ===== -->
<div id="loginView">
  <div class="card">
    <h1>🔐 รายงานค่าคอม/ค่ามือ</h1>
    <div class="field">
      <label>User</label>
      <input id="loginUser" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="new-password"
             onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="primary" onclick="login()">เข้าสู่ระบบ</button>
    <div id="loginStatus"></div>
  </div>
</div>

<!-- ===== หน้า REPORT ===== -->
<div id="reportView" class="wrap" style="display:none">

  <div class="no-print">
    <div class="userbar">
      <div class="who">สวัสดี <b id="whoName"></b> <span id="whoCode" style="color:#666"></span><span id="whoRoles"></span></div>
      <button class="danger" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div class="card">
      <div class="row">
        <div style="flex:1; min-width:180px">
          <label>รายงาน</label>
          <select id="reportSel" onchange="syncReportControls()"></select>
        </div>
        <div id="empPickWrap" style="flex:1; min-width:180px; display:none">
          <label>พนักงาน (Emp code — เลือกหรือพิมพ์เอง)</label>
          <input id="empPick" list="empList" placeholder="เช่น 68015" autocomplete="off">
          <datalist id="empList"></datalist>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="date-control"><label>เริ่ม</label><input type="date" id="start"></div>
        <div class="date-control"><label>สิ้นสุด</label><input type="date" id="end"></div>
        <button class="ghost date-control" onclick="setMonth(0)">เดือนนี้</button>
        <button class="ghost date-control" onclick="setMonth(-1)">เดือนที่แล้ว</button>
        <button class="primary" onclick="run()">แสดงรายงาน</button>
        <button onclick="window.print()">🖨 พิมพ์ / Save PDF</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <div class="report-title">
    <h1 id="printTitle"></h1>
    <div class="sub" id="printRange"></div>
  </div>

  <div id="result"></div>
</div>

<script>
/* ====== CONFIG ====== */
const TOKEN    = 'patDtk7rWm8XkPgWG.613e0a5094a47df76550d554a76c7ba2ee55b5a969d591c0e6a9153a436a7c90'; // จากตาราง Secret ID 1 (read-only)

/* Billing ต้นทาง RELISE Center V.01 (จาก Shared view "รายการจองแก้ไข") */

const SECRET_TABLE = 'Secret';

const SB_ANSWER = 'answer';
const SB_RECEIPT = 'OPD/Recipt upload';

const BOOK_SOURCE_FIELDS = [
  SB_BILLNO, SB_DATE, SB_TYPE, SB_STATUS, SB_BUNDLE, SB_HN,
  SB_CUSTOMER, SB_PHONE, SB_PAYMENT, SB_DEPOSIT, SB_CASE, SB_CHANNEL,
  SB_SOCIAL, SB_OTHER_CHANNEL, SB_PROCEDURE_DATE, SB_PROMOTION,

  { field: SB_ANSWER, key: 'answer', label: 'Answer', type: 'textarea', wide: true },
  { field: SB_DATE, key: 'date', label: 'วันที่', type: 'date' },
  { field: SB_STATUS, key: 'status', label: 'Billing Status', type: 'text' },
  { field: SB_CUSTOMER, key: 'customer', label: 'ชื่อลูกค้า จากฟอร์มแอดมิน', type: 'text' },
  { field: SB_PHONE, key: 'phone', label: 'เบอร์โทร', type: 'text' },
  { field: SB_DEPOSIT, key: 'deposit', label: 'Deposit Added', type: 'number' },
  { field: SB_CASE, key: 'case', label: 'ประเภทเคส', type: 'text' },
  { field: SB_CHANNEL, key: 'channel', label: 'ช่องทาง', type: 'text' },
  { field: SB_SOCIAL, key: 'social', label: 'ชื่อโซเชียล', type: 'text' },
  { field: SB_OTHER_CHANNEL, key: 'other_channel', label: 'ช่องทางอื่นๆ', type: 'text' },
  { field: SB_PROCEDURE_DATE, key: 'procedure_date', label: 'วันเข้าทำหัตถการ', type: 'date' },
  { field: SB_FREE_BUNDLE, key: 'free_bundle', label: 'Bundle ของแถม', type: 'text' }
];

/* ตาราง Shiff */
const SHIFF_TABLE = 'Shiff';
const SH_EMP  = 'Emp code';
const SH_DATE = 'วันที่';
const SH_HOUR = 'ค่าชั่วโมง';

/* ประเภทบิลที่ไม่นับยอดขาย (ค่าคอมแชท) */
const ZERO_SALES_TYPES = ['ใช้คอร์ส'];

/* ช่องทางจ่ายที่นับเข้า "ยอดร้านรวม" (ตามสคริปต์ค่ามือหมอ) */
const PAY_OK = new Set(['รูดบัตร/ผ่อน (SCB)','ผ่อน 0%','Kbank (บริษัท),BBL บริษัท']);

/* ====== รายงานและสิทธิ์ ====== */
const REPORTS = {
  bookings: { name: 'รายการจองทั้งหมด',    roles: ['Admin'] },
  chat:   { name: 'ค่าคอมแชท',            roles: ['Admin'] },
  pa:     { name: 'ค่าคอมยอดขาย (PA)',    roles: ['PA'] },
  sale:   { name: 'ค่าคอมยอดขาย (Sale)',  roles: ['Sale'] },
  bt:     { name: 'ค่ามือ BT',            roles: ['BT'] },
  doctor: { name: 'ค่ามือหมอ',            roles: [] },   // เฉพาะ Mgn/Dev
};
const MANAGER_ROLES = ['Mgn', 'Dev'];

/* ====== เรทค่าคอม ====== */
/* ค่าคอมแชท: เรทต่อบิล */
function rateChat(total){
  if (total >= 40000) return 200;
  if (total > 20000)  return 100;
  return 50;
}
/* PA: ขั้นบันไดจากยอดรวมทั้งช่วง */
function paLadder(total){
  if (total > 2000000) return { label: '5% (2,000,001 ขึ้นไป)',          com: total * 0.05 };
  if (total > 1600000) return { label: '4% (1,600,001–2,000,000)',       com: total * 0.04 };
  if (total > 1200000) return { label: '3% (1,200,001–1,600,000)',       com: total * 0.03 };
  if (total > 800000)  return { label: '2.5% (800,001–1,200,000)',       com: total * 0.025 };
  if (total > 500000)  return { label: '2% (500,001–800,000)',           com: total * 0.02 };
  if (total >= 300000) return { label: 'เหมา 2,000 (300,000–500,000)',   com: 2000 };
  return { label: 'ยังไม่ถึงขั้นต่ำ 300,000', com: 0 };
}
const SALE_RATE = 0.02;   // Sale: Final Payable × 2%

/* ====== HELPERS ====== */
const thBaht = n => (n ?? 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const thDate = s => new Date(s + 'T00:00:00').toLocaleDateString('th-TH',
                    { day: 'numeric', month: 'short', year: 'numeric' });
const parseMoney = v => typeof v === 'number' ? v :
                    (parseFloat(String(v ?? '').replace(/[^\d.\-]/g, '')) || 0);

function extractHN(billNo){
  const s = (billNo || '').trim();
  const i = s.indexOf('-');
  if (i < 0) return s;
  return s.slice(i + 1).split('/')[0].trim();
}
function billPrefix(billNo){
  return (billNo || '').trim().split('-')[0].trim();
}
const parseAdmins = text =>
  String(text || '').split(/[\n,]+/).map(s => s.trim()).filter(Boolean);

const cellText = value => Array.isArray(value)
  ? value.map(v => String(v ?? '').trim()).filter(Boolean).join(', ')
  : String(value ?? '').trim();

function bookingStatus(value){
  const text = cellText(value);
  if (text.includes('ใช้แล้ว')) return { label: 'ใช้แล้ว', cls: 'used' };
  if (text.includes('ยังไม่ใช้')) return { label: 'ยังไม่เข้ามาใช้', cls: 'pending' };
  return { label: 'ไม่พบสถานะ Used?', cls: 'unknown' };
}

function billDetails(bills){
  return `<div class="bill-list">${bills.map(b => {
    const status = b.type === 'จอง' ? bookingStatus(b.used) : null;
    return `<div class="bill-line"><b>${esc(b.no || '(ไม่มีเลขบิล)')}</b>
      <div class="bill-meta">${esc(b.type || '(ไม่ระบุประเภท)')} · ${thBaht(b.amount)} บาท
      ${status ? ` <span class="statuschip ${status.cls}">${status.label}</span>` : ''}</div>
      <div class="bill-meta">ชื่อ Bundle Purchased: ${esc(b.bundle || '-')}</div></div>`;
  }).join('')}</div>`;
}

function indexBilling(records){
  const byBill = new Map();
  for (const rec of records){
    const f = rec.fields;
    const billNo = cellText(f[B_BILLNO]);
    if (!billNo) continue;
    const info = {
      used: f[B_USED],
      bundle: cellText(f[B_BUNDLE]),
      sale: cellText(f[B_SALE]),
      day: String(f[B_DATE] || '').slice(0, 10),
      type: cellText(f[B_TYPE]),
      hn: cellText(f[B_HN]),
      sales: parseMoney(f[B_SALECOM] ?? f[B_FINAL])
    };
    byBill.set(billNo, info);
    byBill.set(billPrefix(billNo), info);
  }
  return byBill;
}

function esc(s){
  return String(s ?? '').replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

const _cache = {};
async function api(tableIdOrName, params){
  const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(tableIdOrName)}?${params}`;
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + TOKEN } });
  if (!res.ok) throw new Error('Airtable error ' + res.status);
  return res.json();
}
async function fetchTable(tableIdOrName, fields, formula){
  const key = tableIdOrName + '|' + fields.join(',') + '|' + formula;
  if (_cache[key]) return _cache[key];
  const fq = fields.map(f => 'fields[]=' + encodeURIComponent(f)).join('&');
  let records = [], offset = '';
  do {
    const data = await api(tableIdOrName,
      `pageSize=100&${fq}&filterByFormula=${encodeURIComponent(formula)}` +
      (offset ? `&offset=${offset}` : ''));
    records.push(...data.records);
    offset = data.offset || '';
  } while (offset);
  _cache[key] = records;
  return records;
}

function session(){ try { return JSON.parse(sessionStorage.getItem('relise_user')) || null; } catch(e){ return null; } }
const isManager = u => (u.roles || []).some(r => MANAGER_ROLES.includes(r));
function allowedReports(u){
  const keys = Object.keys(REPORTS);
  if (isManager(u)) return keys;

async function login(){
  const st = document.getElementById('loginStatus');
  const user = document.getElementById('loginUser').value.trim().replace(/"/g, '');
  const pass = document.getElementById('loginPass').value.replace(/"/g, '');
  if (!user || !pass){ st.className = 'err'; st.textContent = 'กรุณากรอก User และ Password'; return; }

  st.className = ''; st.textContent = 'กำลังตรวจสอบ...';
  try {
    const formula = `AND({${U_USER}}="${user}", {${U_PASS}}="${pass}")`;
    const data = await api(USER_TABLE,
      'maxRecords=5' +
      '&fields[]=' + encodeURIComponent(U_NAME) +
      '&fields[]=' + encodeURIComponent(U_CODE) +
      '&fields[]=' + encodeURIComponent(U_ROLE) +
      '&filterByFormula=' + encodeURIComponent(formula));

    if (!data.records.length){
      st.className = 'err'; st.textContent = '❌ User หรือ Password ไม่ถูกต้อง';
      return;
    }
    if (data.records.length > 1){
      st.className = 'err';
      st.textContent = '❌ พบ User นี้ซ้ำ ' + data.records.length + ' แถวในตาราง Liff test — แจ้งแอดมินระบบให้ลบแถวซ้ำ';
      return;
    }
    const f = data.records[0].fields;
    const codes = String(f[U_CODE] || '').split(/[\n,\s]+/).map(s => s.trim()).filter(Boolean);
    const roles = (f[U_ROLE] || []).map(r => String(r).trim());
    if (!roles.length){
      st.className = 'err'; st.textContent = '❌ บัญชีนี้ยังไม่ได้กำหนดสิทธิ์ — แจ้งแอดมินระบบ';
      return;
    }
    if (!codes.length && !roles.some(r => MANAGER_ROLES.includes(r))){
      st.className = 'err'; st.textContent = '❌ บัญชีนี้ยังไม่ได้กำหนด Emp Code — แจ้งแอดมินระบบ';
      return;
    }
    sessionStorage.setItem('relise_user', JSON.stringify({
      name: f[U_NAME] || user, codes, roles
    }));
    showReport();
  } catch (e){
    st.className = 'err'; st.textContent = '❌ ' + e.message;
  }
}

function setMonth(offset){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const iso = x => x.getFullYear() + '-' +
    String(x.getMonth() + 1).padStart(2, '0') + '-' +
    String(x.getDate()).padStart(2, '0');
  document.getElementById('start').value = iso(d);
  document.getElementById('end').value = iso(last);
}

let bookingSourceToken = '';

async function loadBookingSourceToken(){
  if (bookingSourceToken) return bookingSourceToken;
  const params = 'maxRecords=1' +
    '&fields[]=' + encodeURIComponent(SECRET_TOKEN_FIELD) +
    '&filterByFormula=' + encodeURIComponent(`{${SECRET_ID_FIELD}} = 2`);
  const data = await api(SECRET_TABLE, params);
  const token = cellText(data.records?.[0]?.fields?.[SECRET_TOKEN_FIELD]);
  if (!token) throw new Error('ไม่พบ Token patt ใน Secret ID 2');
  bookingSourceToken = token;
  return token;
}

async function sourceAirtableRequest(query, options = {}){
  if (!bookingSourceToken) throw new Error('กรุณาเชื่อมสิทธิ์แก้ไข Airtable ก่อน');
  const url = `https://api.airtable.com/v0/${BOOK_SOURCE_BASE}/${BOOK_SOURCE_TABLE}${query || ''}`;
  const res = await fetch(url, {
    ...options,
    headers: {
      Authorization: 'Bearer ' + bookingSourceToken,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok){
    const message = data?.error?.message || data?.error?.type || `Airtable error ${res.status}`;
    throw new Error(message);
  }
  return data;
}

async function fetchSourceBookingPages(fields, asDisplayText){
  const records = [];
  let offset = '';
  do {
    const params = new URLSearchParams();
    params.set('pageSize', '100');
    params.set('view', BOOK_SOURCE_VIEW);
    params.set('filterByFormula', `{${SB_TYPE}} = 'จอง'`);
    if (asDisplayText){
      params.set('cellFormat', 'string');
      params.set('timeZone', 'Asia/Bangkok');
      params.set('userLocale', 'th');
    }
    fields.forEach(field => params.append('fields[]', field));
    if (offset) params.set('offset', offset);
    const data = await sourceAirtableRequest('?' + params.toString());
    records.push(...data.records);
    offset = data.offset || '';
  } while (offset);
  return records;
}

async function fetchSourceBookings(){
  if (sourceBookingCache) return sourceBookingCache;
  const rawRecords = await fetchSourceBookingPages(BOOK_SOURCE_FIELDS, false);
  const displayRecords = await fetchSourceBookingPages(
    [SB_BILLNO, SB_BUNDLE, SB_HN, SB_PAYMENT, SB_PROMOTION], true);
  const displayById = new Map(displayRecords.map(rec => [rec.id, rec.fields]));
  sourceBookingCache = rawRecords.map(rec => ({
    ...rec,
    displayFields: displayById.get(rec.id) || {}
  }));
  return sourceBookingCache;
}

function safeAttachmentUrl(value){
  try {
    const url = new URL(String(value || ''));
    return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
  } catch (e){ return ''; }
}

function slipThumbHtml(attachment){
  const href = safeAttachmentUrl(attachment?.url);
  if (!href) return '';
  const preview = safeAttachmentUrl(attachment?.thumbnails?.small?.url || attachment?.thumbnails?.large?.url);
  const name = attachment?.filename || 'เปิดสลิป';
  return `<a class="slip-thumb" href="${esc(href)}" target="_blank" rel="noopener"
    title="${esc(name)}">${preview ? `<img src="${esc(preview)}" alt="${esc(name)}">` : 'ไฟล์'}</a>`;
}

function existingSlipsHtml(attachments){

      target="_blank" rel="noopener">${esc(attachment.filename || 'เปิดไฟล์')}</a>
      <div class="note">${attachment.size ? Math.ceil(attachment.size / 1024).toLocaleString('th-TH') + ' KB' : ''}</div></div>
    <label class="check-label danger-check"><input type="checkbox" data-remove-slip="${esc(attachment.id)}"> ลบไฟล์นี้</label>
  </div>`).join('');

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
    reader.onerror = () => reject(new Error(`อ่านไฟล์ ${file.name} ไม่สำเร็จ`));
    reader.readAsDataURL(file);
  });
}

async function uploadSourceSlip(recordId, file){
  if (file.size > MAX_SLIP_BYTES) throw new Error(`${file.name} มีขนาดเกิน 5 MB`);
  const encoded = await fileToBase64(file);
  const res = await fetch(
    `https://content.airtable.com/v0/${BOOK_SOURCE_BASE}/${recordId}/${SB_RECEIPT_FIELD_ID}/uploadAttachment`,
    {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + bookingSourceToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ contentType: file.type || 'application/octet-stream', file: encoded, filename: file.name })
    });
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error(data?.error?.message || data?.error?.type || `อัปโหลดไม่สำเร็จ (${res.status})`);
  return data;
}

async function getSourceSlips(recordId){
  const query = `/${encodeURIComponent(recordId)}?fields%5B%5D=${encodeURIComponent(SB_RECEIPT)}`;
  const data = await sourceAirtableRequest(query);
  return Array.isArray(data.fields?.[SB_RECEIPT]) ? data.fields[SB_RECEIPT] : [];
}

function slipsToKeep(currentSlips, originalSlips, removeIds, replaceSlips){
  if (replaceSlips){
    const originalIds = new Set(originalSlips.map(item => item.id));
    return currentSlips.filter(item => !originalIds.has(item.id));
  }
  return currentSlips.filter(item => !removeIds.has(item.id));
}

function filterBookingRows(){
  const search = document.getElementById('bookingSearch');
  const filter = document.getElementById('bookingUsedFilter');
  if (!search || !filter) return;
  const query = search.value.trim().toLowerCase();
  let shown = 0, total = 0;
  document.querySelectorAll('[data-booking-row]').forEach(row => {
    total++;
    const matchesBill = !query || row.dataset.bill.includes(query);
    const matchesUsed = filter.value === 'all' || row.dataset.used === filter.value;
    const visible = matchesBill && matchesUsed;
    row.style.display = visible ? '' : 'none';
    if (visible) shown++;
  });
  const count = document.getElementById('bookingVisibleCount');
  if (count) count.textContent = `แสดง ${shown} จาก ${total} รายการ`;
}

function fallbackCopyText(text){
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand('copy');
  area.remove();
  if (!copied) throw new Error('ไม่สามารถเข้าถึงคลิปบอร์ดได้');
}

async function copyBookingAnswer(recordId){
  const booking = bookingEditorRecords.get(recordId);
  const answer = booking?.answer || '';
  if (!answer){
    alert('รายการนี้ยังไม่มี Answer');
    return;
  }
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(answer);
    } else {
      fallbackCopyText(answer);
    }
    const status = document.getElementById('status');
    if (status){
      status.className = '';
      status.textContent = `คัดลอก Answer ของ ${booking.billNo || 'รายการจอง'} แล้ว`;
    }
  } catch (e){
    alert('คัดลอกไม่สำเร็จ กรุณาเลือกข้อความและคัดลอกด้วยตนเอง');
  }
}

async function saveBookingEdit(){
  const recordId = document.getElementById('bookingEditRecordId').value;
  const booking = bookingEditorRecords.get(recordId);
  const message = document.getElementById('bookingEditorMessage');
  const button = document.getElementById('bookingSaveButton');
  if (!recordId || !booking) return;
  const fields = {};
  BOOKING_EDIT_FIELDS.forEach(def => {
    const value = document.getElementById('bookingEdit_' + def.key).value.trim();
    fields[def.field] = value === '' ? null : (def.type === 'number' ? parseMoney(value) : value);
  });
  const files = [...document.getElementById('bookingSlipFiles').files];
  const replaceSlips = document.getElementById('bookingReplaceSlips').checked;
  const removeIds = new Set([...document.querySelectorAll('[data-remove-slip]:checked')]
    .map(input => input.dataset.removeSlip));
  if (replaceSlips && !files.length){
    message.className = 'editor-message err';
    message.textContent = 'กรุณาเลือกสลิปใหม่ก่อนใช้คำสั่งแทนที่';
    return;
  }
  const oversized = files.find(file => file.size > MAX_SLIP_BYTES);
  if (oversized){
    message.className = 'editor-message err';
    message.textContent = `${oversized.name} มีขนาดเกิน 5 MB`;
    return;
  }
  button.disabled = true;
  message.className = 'editor-message';
  message.textContent = 'กำลังบันทึก...';
  let uploadedCount = 0;
  try {
    await updateSourceBooking(recordId, fields);
    for (const file of files){
      message.textContent = `กำลังอัปโหลดสลิป ${uploadedCount + 1} จาก ${files.length}...`;
      await uploadSourceSlip(recordId, file);
      uploadedCount++;
    }
    if (replaceSlips || removeIds.size){
      const currentSlips = files.length ? await getSourceSlips(recordId) : booking.slips;
      const keptSlips = slipsToKeep(currentSlips, booking.slips, removeIds, replaceSlips);
      if (replaceSlips && !keptSlips.length) throw new Error('อัปโหลดสลิปใหม่ไม่สำเร็จ จึงยังไม่ได้ลบสลิปเดิม');
      await updateSourceBooking(recordId, {
        [SB_RECEIPT]: keptSlips.map(item => ({ id: item.id }))
      });
    }
    sourceBookingCache = null;
    closeBookingEditor();
    await run();
    const st = document.getElementById('status');
    st.className = '';
    st.textContent = 'บันทึกข้อมูลเรียบร้อยแล้ว';
  } catch (e){
    if (uploadedCount) sourceBookingCache = null;
    message.className = 'editor-message err';
    message.textContent = (uploadedCount ? `อัปโหลดแล้ว ${uploadedCount} ไฟล์ แต่` : '') +
      'บันทึกไม่สำเร็จ: ' + e.message;
    button.disabled = false;
  }
}

/* ============================================================
   รายงาน 1: ค่าคอมแชท (Admin) — ตรรกะเดิมทุกข้อ
   ============================================================ */
async function reportChat(codes, start, end){
  const [records, billingRecords] = await Promise.all([
    fetchTable(BEN_TABLE,
      [F_BILLNO, F_DATE, F_SALES, F_ADMINS, F_ADMIN_N, F_DEPOSIT, F_TYPE],
      `AND(FIND('PAID', ARRAYJOIN({${F_STATUS}})), {${F_DATE}} != '')`),
    fetchBillingPaid()
  ]);

  // สถานะจองและชื่อ Bundle ยึดข้อมูลจากตาราง Billing โดยตรง
  const billingByBill = indexBilling(billingRecords);

  const items = records.map(rec => {
    const f = rec.fields;
    const billNo = f[F_BILLNO] || '';
    const dep = String(f[F_DEPOSIT] || '').trim();
    const types = (f[F_TYPE] || []).map(t => String(t).trim());
    const zeroSale = types.some(t => ZERO_SALES_TYPES.includes(t));
    const billingInfo = billingByBill.get(billNo) || billingByBill.get(billPrefix(billNo)) || {};
    return {
      billNo, prefix: billPrefix(billNo), hn: extractHN(billNo),
      day: String(f[F_DATE] || '').slice(0, 10),
      sales: zeroSale ? 0 : parseMoney(f[F_SALES]),
      zeroSale,
      booking: types.includes('จอง'),
      used: billingInfo.used,
      bundle: billingInfo.bundle,
      adminN: Number(f[F_ADMIN_N]) || 0,
      admins: parseAdmins(f[F_ADMINS]),
      saleOwners: parseAdmins(billingInfo.sale),
      depRef: dep ? billPrefix(dep) : null
    };
  }).filter(it => it.day);

  // บิลจองที่ยังไม่มีแถวในตารางค่ามือ ให้นำมาคิดจาก Billing โดยตรง
  const benefitPrefixes = new Set(items.map(it => it.prefix).filter(Boolean));
  for (const rec of billingRecords){
    const f = rec.fields;
    const type = cellText(f[B_TYPE]);
    const billNo = cellText(f[B_BILLNO]);
    const prefix = billPrefix(billNo);
    if (type !== 'จอง' || !billNo || benefitPrefixes.has(prefix)) continue;
    const info = billingByBill.get(billNo) || billingByBill.get(prefix) || {};
    items.push({
      billNo, prefix, hn: info.hn || extractHN(billNo), day: info.day,
      sales: info.sales, zeroSale: false, booking: true,
      used: info.used, bundle: info.bundle, adminN: 0, admins: [],
      saleOwners: parseAdmins(info.sale), depRef: null
    });
  }

  const parent = items.map((_, i) => i);
  function find(i){ while (parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; }
  function union(a, b){ const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; }
  const byHNDay = new Map(), byPrefix = new Map();
  items.forEach((it, i) => {
    if (it.hn){
      const key = it.hn + '|' + it.day;
      if (byHNDay.has(key)) union(byHNDay.get(key), i); else byHNDay.set(key, i);
    }
    if (it.prefix){
      if (byPrefix.has(it.prefix)) union(byPrefix.get(it.prefix), i); else byPrefix.set(it.prefix, i);
    }
  });
  items.forEach((it, i) => {
    if (it.depRef && byPrefix.has(it.depRef)) union(i, byPrefix.get(it.depRef));
  });
  const groups = new Map();
  items.forEach((it, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(it);
  });

  // รายการจองดึงจาก Billing โดยตรง เพื่อให้ครบทั้งใช้แล้วและยังไม่ใช้
  const bookings = billingRecords.map(rec => rec.fields).filter(f => {
    const day = String(f[B_DATE] || '').slice(0, 10);
    return cellText(f[B_TYPE]) === 'จอง' && day >= start && day <= end &&
      matchCode(cellText(f[B_SALE]), codes);
  }).map(f => ({
    billNo: cellText(f[B_BILLNO]),
    hn: cellText(f[B_HN]) || extractHN(cellText(f[B_BILLNO])),
    day: String(f[B_DATE] || '').slice(0, 10),
    sales: parseMoney(f[B_SALECOM] ?? f[B_FINAL]),
    used: f[B_USED], bundle: cellText(f[B_BUNDLE])
  }));

  const bills = [];
  for (const list of groups.values()){
    const allAdmins = new Set();
    list.forEach(it => it.admins.forEach(a => allAdmins.add(a)));
    // บิลจองยังไม่ใช้จะยังไม่มี Admin Commission จึงใช้ Sale เป็นผู้รับผิดชอบสำรอง
    if (!allAdmins.size){
      list.forEach(it => it.saleOwners.forEach(a => allAdmins.add(a)));
    }
    if (![...allAdmins].some(a => matchCode(a, codes))) continue;

    const day = list.map(it => it.day).sort().pop();
    if (day < start || day > end) continue;

    const sales = list.reduce((s, it) => s + it.sales, 0);
    const n = Math.max(...list.map(it => it.adminN), allAdmins.size, 1);
    const rate = rateChat(sales);
    const depPrefixes = new Set(list.map(it => it.depRef).filter(Boolean));
    const billNos = list.map(it => ({
      no: it.billNo, dep: depPrefixes.has(it.prefix), zero: it.zeroSale,
      booking: it.booking, used: it.used, bundle: it.bundle
    }));
    const missing = [...depPrefixes].filter(p => !byPrefix.has(p));
    const hn = (list.find(it => it.day === day && it.hn) || list.find(it => it.hn) || {}).hn
               || list[0].billNo;
    bills.push({ hn, day, billNos, missing, sales, rate, n, com: rate / n });
  }

  const totalCom = bills.reduce((s, b) => s + b.com, 0);
  const totalSales = bills.reduce((s, b) => s + b.sales, 0);

  let html = bigNum([
    [thBaht(totalCom), 'ค่าคอมแชทรวม (บาท)'],
    [bills.length, 'จำนวนบิล'],
    [thBaht(totalSales), 'ยอดขายรวม (บาท)']
  ]);

  if (!bills.length){
    html += `<div class="card warn">ไม่พบบิลที่ฟิลด์ Admin Commission หรือ Sale มีรหัส "${esc(codes.join(', '))}"
      ในช่วงวันที่ที่เลือก — เช็คว่า Emp Code ในตาราง Liff test ตรงกับที่ใช้ในบิล (เช่น 68015)
      และช่วงวันที่ถูกต้อง</div>`;
  }

  const byDay = groupByDay(bills);
  let rows = '';
  for (const day of [...byDay.keys()].sort()){
    rows += `<tr class="daybar"><td colspan="6">📅 ${thDate(day)}</td></tr>`;
    for (const b of byDay.get(day)){
      let nos = b.billNos.map(x => {
        let label = esc(x.no);
        if (x.dep)  label += ' (มัดจำ)';
        if (x.zero) label += ' (ใช้คอร์ส ฿0)';
        const status = x.booking ? bookingStatus(x.used) : null;
        const bill = (x.dep || x.zero) ? `<span class="dep">${label}</span>` : label;
        return `<div class="bill-line">${bill}${status
          ? ` <span class="statuschip ${status.cls}">${status.label}</span>` : ''}
          <div class="bill-meta">ชื่อ Bundle Purchased: ${esc(x.bundle || '-')}</div></div>`;
      }).join('');
      if (b.missing.length) nos += `<div class="warn">⚠️ มัดจำ ${esc(b.missing.join(', '))} ไม่พบแถวในตาราง</div>`;
      rows += `<tr><td>${esc(b.hn)}</td>
        <td style="font-size:12px;color:#666">${nos}</td>
        <td class="num">${thBaht(b.sales)}</td>
        <td class="num">${b.rate}</td>
        <td class="num">÷ ${b.n}</td>
        <td class="num"><b>${thBaht(b.com)}</b></td></tr>`;
    }
  }
  html += tableCard(
    `<tr><th>HN</th><th>เลขบิล</th><th class="num">ยอดขายรวมบิล</th>
     <th class="num">เรท</th><th class="num">แอดมิน</th><th class="num">ได้รับ</th></tr>`,
    rows, 6,
    `<tr class="total"><td colspan="2">รวม ${bills.length} บิล</td>
     <td class="num">${thBaht(totalSales)}</td><td></td><td></td>
     <td class="num">${thBaht(totalCom)}</td></tr>`);

  const usedBookingCount = bookings.filter(b => bookingStatus(b.used).cls === 'used').length;
  const pendingBookingCount = bookings.filter(b => bookingStatus(b.used).cls === 'pending').length;
  const unknownBookingCount = bookings.length - usedBookingCount - pendingBookingCount;
  const bookingRows = bookings.sort((a, b) => a.day.localeCompare(b.day) || a.billNo.localeCompare(b.billNo))
    .map(b => {
      const status = bookingStatus(b.used);
      return `<tr><td>${thDate(b.day)}</td><td>${esc(b.hn || '-')}</td>
        <td><b>${esc(b.billNo || '(ไม่มีเลขบิล)')}</b></td>
        <td>${esc(b.bundle || '-')}</td>
        <td class="num">${thBaht(b.sales)}</td>
        <td><span class="statuschip ${status.cls}">${status.label}</span></td></tr>`;
    }).join('');
  html += `<div class="card"><h2 class="section-title">รายการจองทั้งหมดในช่วงวันที่</h2>
    <div class="note">สถานะอ้างอิงจากฟิลด์ Used? ใน Billing · รวม ${bookings.length} รายการ · ใช้แล้ว ${usedBookingCount} · ยังไม่เข้ามาใช้ ${pendingBookingCount}${unknownBookingCount ? ` · ไม่พบสถานะ ${unknownBookingCount}` : ''}</div>
    <div class="tscroll" style="margin-top:10px"><table>
      <tr><th>วันที่จอง</th><th>HN</th><th>เลขบิล</th><th>ชื่อ Bundle Purchased</th><th class="num">ยอดจอง</th><th>สถานะ</th></tr>
      ${bookingRows || `<tr><td colspan="6" style="text-align:center;color:#999">ไม่มีรายการจองในช่วงที่เลือก</td></tr>`}
    </table></div></div>`;
  return html;
}

/* ============================================================
   รายงาน 2: ค่าคอมยอดขาย PA — ซื้อคอร์ส + จอง → ขั้นบันได
   ============================================================ */
async function fetchBillingPaid(){
  return fetchTable(BILL_TABLE,
    [B_BILLNO, B_DATE, B_TYPE, B_FINAL, B_SALECOM, B_SALE, B_PAY, B_HN, B_USED, B_BUNDLE],
    `AND({${B_STATUS}} = 'PAID', {${B_DATE}} != '')`);
}

async function reportPA(codes, start, end){
  const records = await fetchBillingPaid();
  // day -> Map(HN -> {course, booking, count, bills})  รวม HN เดียวกันแต่ยังเก็บรายละเอียดทุกบิล
  const byDay = new Map();
  let totalCourse = 0, totalBooking = 0, billCount = 0;

  for (const rec of records){
    const f = rec.fields;
    const day = String(f[B_DATE] || '').slice(0, 10);
    if (!day || day < start || day > end) continue;
    const type = String(f[B_TYPE] || '').trim();
    if (type !== 'ซื้อคอร์ส' && type !== 'จอง') continue;
    const sale = cellText(f[B_SALE]);
    if (!matchCode(sale, codes)) continue;

    const hn = String(f[B_HN] || '').trim() || '(ไม่มี HN)';
    const amt = parseMoney(f[B_SALECOM] ?? f[B_FINAL]);

    if (!byDay.has(day)) byDay.set(day, new Map());
    const hnMap = byDay.get(day);
    if (!hnMap.has(hn)) hnMap.set(hn, { course: 0, booking: 0, count: 0, bills: [] });
    const b = hnMap.get(hn);
    b.count++; billCount++;
    b.bills.push({ no: cellText(f[B_BILLNO]), type, amount: amt, used: f[B_USED], bundle: cellText(f[B_BUNDLE]) });
    if (type === 'ซื้อคอร์ส'){ b.course += amt; totalCourse += amt; }
    else                     { b.booking += amt; totalBooking += amt; }
  }

  const total = totalCourse + totalBooking;
  const ladder = paLadder(total);

  let html = bigNum([
    [thBaht(ladder.com), 'ค่าคอมที่ได้ (บาท)'],
    [thBaht(total), 'ยอดรวม ซื้อคอร์ส+จอง'],
    [thBaht(totalCourse), 'ยอดซื้อคอร์ส'],
    [thBaht(totalBooking), 'ยอดจอง'],
    [billCount, 'จำนวนบิล']
  ]);
  html += `<div class="card"><b>ขั้นที่ใช้:</b> ${esc(ladder.label)}
    <div class="note">ขั้นบันได: 300,000–500,000 = เหมา 2,000 | 500,001–800,000 = 2% | 800,001–1,200,000 = 2.5% | 1,200,001–1,600,000 = 3% | 1,600,001–2,000,000 = 4% | 2,000,001 ขึ้นไป = 5% (คิดจากยอดรวมทั้งช่วง)</div></div>`;

  let rows = '';
  for (const day of [...byDay.keys()].sort()){
    rows += `<tr class="daybar"><td colspan="5">📅 ${thDate(day)}</td></tr>`;
    const hnMap = byDay.get(day);
    let dCourse = 0, dBooking = 0;
    for (const hn of [...hnMap.keys()].sort()){
      const b = hnMap.get(hn);
      dCourse += b.course; dBooking += b.booking;
      rows += `<tr><td>${esc(hn)}${b.count > 1 ? ` <span class="note">(${b.count} บิล)</span>` : ''}</td>
        <td>${billDetails(b.bills)}</td>
        <td class="num">${b.course ? thBaht(b.course) : '-'}</td>
        <td class="num">${b.booking ? thBaht(b.booking) : '-'}</td>
        <td class="num"><b>${thBaht(b.course + b.booking)}</b></td></tr>`;
    }
    rows += `<tr><td colspan="2" style="color:#666">รวมวัน ${thDate(day)}</td>
      <td class="num" style="color:#666">${thBaht(dCourse)}</td>
      <td class="num" style="color:#666">${thBaht(dBooking)}</td>
      <td class="num" style="color:#666"><b>${thBaht(dCourse + dBooking)}</b></td></tr>`;
  }
  html += tableCard(
    `<tr><th>HN</th><th>รายละเอียดบิล</th><th class="num">ยอดซื้อคอร์ส</th><th class="num">ยอดจอง</th><th class="num">รวม</th></tr>`,
    rows, 5,
    `<tr class="total"><td colspan="2">รวมทั้งช่วง (${billCount} บิล)</td>
     <td class="num">${thBaht(totalCourse)}</td>
     <td class="num">${thBaht(totalBooking)}</td>
     <td class="num">${thBaht(total)}</td></tr>`);
  return html;
}

/* ============================================================
   รายงาน 3: ค่าคอมยอดขาย Sale — Final Payable × 2%
   ============================================================ */
async function reportSale(codes, start, end){
  const records = await fetchBillingPaid();
  // day -> Map(HN -> {..., bills})  รวม HN เดียวกันแต่ยังเก็บรายละเอียดทุกบิล
  const byDay = new Map();
  let total = 0, totalBookCount = 0, billCount = 0;

  for (const rec of records){
    const f = rec.fields;
    const day = String(f[B_DATE] || '').slice(0, 10);
    if (!day || day < start || day > end) continue;
    const type = String(f[B_TYPE] || '').trim();
    if (type !== 'ซื้อคอร์ส' && type !== 'จอง') continue;
    const sale = cellText(f[B_SALE]);
    if (!matchCode(sale, codes)) continue;

    const hn = String(f[B_HN] || '').trim() || '(ไม่มี HN)';
    if (!byDay.has(day)) byDay.set(day, new Map());
    const hnMap = byDay.get(day);
    if (!hnMap.has(hn)) hnMap.set(hn, { course: 0, bookAmt: 0, bookCount: 0, count: 0, bills: [] });
    const b = hnMap.get(hn);
    b.count++; billCount++;
    const billAmt = parseMoney(f[B_FINAL]);
    b.bills.push({ no: cellText(f[B_BILLNO]), type, amount: billAmt, used: f[B_USED], bundle: cellText(f[B_BUNDLE]) });

    if (type === 'จอง'){
      // บิลจอง: แสดงไว้ให้เห็น แต่ไม่มีค่าคอม
      b.bookAmt += billAmt;
      b.bookCount++;
      totalBookCount++;
    } else {
      const amt = billAmt;
      b.course += amt;
      total += amt;
    }
  }

  const com = total * SALE_RATE;

  let html = bigNum([
    [thBaht(com), 'ค่าคอมที่ได้ (2%)'],
    [thBaht(total), 'ยอดซื้อคอร์ส (Final Payable)'],
    [totalBookCount, 'จำนวนรายการจอง'],
    [billCount, 'จำนวนบิลทั้งหมด']
  ]);
  html += `<div class="card note">คิดค่าคอม 2% เฉพาะบิล "ซื้อคอร์ส" เท่านั้น — บิล "จอง" แสดงไว้ให้เห็นแต่<b>ไม่มีค่าคอม</b></div>`;

  let rows = '';
  for (const day of [...byDay.keys()].sort()){
    rows += `<tr class="daybar"><td colspan="5">📅 ${thDate(day)}</td></tr>`;
    const hnMap = byDay.get(day);
    let dCourse = 0;
    for (const hn of [...hnMap.keys()].sort()){
      const b = hnMap.get(hn);
      dCourse += b.course;
      const bookCell = b.bookCount
        ? `${thBaht(b.bookAmt)} <span class="dep">(จอง ${b.bookCount} รายการ — ไม่มีค่าคอม)</span>`
        : '-';
      rows += `<tr><td>${esc(hn)}${b.count > 1 ? ` <span class="note">(${b.count} บิล)</span>` : ''}</td>
        <td>${billDetails(b.bills)}</td>
        <td class="num">${b.course ? thBaht(b.course) : '-'}</td>
        <td class="num">${bookCell}</td>
        <td class="num"><b>${b.course ? thBaht(b.course * SALE_RATE) : '-'}</b></td></tr>`;
    }
    rows += `<tr><td colspan="2" style="color:#666">รวมวัน ${thDate(day)}</td>
      <td class="num" style="color:#666">${thBaht(dCourse)}</td>
      <td class="num"></td>
      <td class="num" style="color:#666"><b>${thBaht(dCourse * SALE_RATE)}</b></td></tr>`;
  }
  html += tableCard(
    `<tr><th>HN</th><th>รายละเอียดบิล</th><th class="num">ยอดซื้อคอร์ส</th><th class="num">ยอดจอง (ไม่มีค่าคอม)</th><th class="num">ค่าคอม 2%</th></tr>`,
    rows, 5,
    `<tr class="total"><td colspan="2">รวมทั้งช่วง (${billCount} บิล)</td>
     <td class="num">${thBaht(total)}</td>
     <td class="num">จอง ${totalBookCount} รายการ</td>
     <td class="num">${thBaht(com)}</td></tr>`);
  return html;
}

/* ============================================================
   รายงาน 4: ค่ามือ BT — รวม new com BT รายวัน
   ============================================================ */
async function reportBT(codes, start, end){
  const [records, billingRecords] = await Promise.all([
    fetchTable(BEN_TABLE,
      [F_BILLNO, F_DATE, F_TYPE, F_SALES, F_BT_COM, F_BT_WHO],
      `AND(FIND('PAID', ARRAYJOIN({${F_STATUS}})), {${F_DATE}} != '', {${F_BT_COM}} != '')`),
    fetchBillingPaid()
  ]);
  const billingByBill = indexBilling(billingRecords);

  const byDay = new Map();
  let total = 0, totalAfterDiscount = 0;

  for (const rec of records){
    const f = rec.fields;
    const day = String(f[F_DATE] || '').slice(0, 10);
    if (!day || day < start || day > end) continue;
    if (!matchCode(f[F_BT_WHO], codes)) continue;
    const amt = parseMoney(f[F_BT_COM]);
    if (!amt) continue;
    if (!byDay.has(day)) byDay.set(day, []);
    const billNo = cellText(f[F_BILLNO]);
    const billingInfo = billingByBill.get(billNo) || billingByBill.get(billPrefix(billNo)) || {};
    // ฟิลด์ "ยอดขาย" ในตารางค่ามือ คือค่าเดียวกับ Total After discount (DR)
    const afterDiscount = parseMoney(f[F_SALES]);
    byDay.get(day).push({
      billNo, hn: extractHN(billNo), type: cellText(f[F_TYPE]),
      bundle: billingInfo.bundle, afterDiscount, amt
    });
    total += amt;
    totalAfterDiscount += afterDiscount;
  }

  const count = [...byDay.values()].reduce((sum, list) => sum + list.length, 0);

  let html = bigNum([
    [thBaht(total), 'ค่ามือ BT รวม (บาท)'],
    [thBaht(totalAfterDiscount), 'Total After discount (DR)'],
    [count, 'จำนวนรายการ'],
    [byDay.size, 'จำนวนวัน']
  ]);

  let rows = '';
  for (const day of [...byDay.keys()].sort()){
    const items = byDay.get(day);
    rows += `<tr class="daybar"><td colspan="6">📅 ${thDate(day)}</td></tr>`;
    for (const item of items){
      rows += `<tr><td>${esc(item.hn || '(ไม่มี HN)')}</td>
        <td><b>${esc(item.billNo || '(ไม่มีเลขบิล)')}</b></td>
        <td>${esc(item.type || '-')}</td>
        <td>${esc(item.bundle || '-')}</td>
        <td class="num">${thBaht(item.afterDiscount)}</td>
        <td class="num"><b>${thBaht(item.amt)}</b></td></tr>`;
    }
    const dayAfterDiscount = items.reduce((sum, item) => sum + item.afterDiscount, 0);
    const dayTotal = items.reduce((sum, item) => sum + item.amt, 0);
    rows += `<tr><td colspan="4" style="color:#666">รวมวัน ${thDate(day)}</td>
      <td class="num" style="color:#666">${thBaht(dayAfterDiscount)}</td>
      <td class="num" style="color:#666"><b>${thBaht(dayTotal)}</b></td></tr>`;
  }
  html += tableCard(
    `<tr><th>HN</th><th>เลขบิล</th><th>ประเภทบิล</th><th>ชื่อ Bundle Purchased</th><th class="num">Total After discount (DR)</th><th class="num">ค่ามือ BT</th></tr>`,
    rows, 6,
    `<tr class="total"><td colspan="4">รวมทั้งช่วง (${count} รายการ)</td><td class="num">${thBaht(totalAfterDiscount)}</td><td class="num">${thBaht(total)}</td></tr>`);
  return html;
}

/* ============================================================
   รายงาน 5: ค่ามือหมอ (Mgn/Dev) — ตามสคริปต์เดิม แสดงผลอย่างเดียว
   ============================================================ */
async function reportDoctor(codes, start, end){
  const benefit = await fetchTable(BEN_TABLE,
    [F_DATE, F_DR_COM, F_DR_WHO],
    `AND(FIND('PAID', ARRAYJOIN({${F_STATUS}})), {${F_DATE}} != '')`);

  const feesByDay = new Map();
  let feeTotal = 0, allDoctorTotal = 0;

  for (const rec of benefit.filter(r => r.fields[F_DR_COM])){
    const f = rec.fields;
    const day = String(f[F_DATE] || '').slice(0, 10);
    if (!day || day < start || day > end) continue;
    const amt = parseMoney(f[F_DR_COM]);
    if (!amt) continue;
    allDoctorTotal += amt;                       // ค่ามือรวมหมอทุกคน
    if (!matchCode(f[F_DR_WHO], codes)) continue;
    feesByDay.set(day, (feesByDay.get(day) || 0) + amt);
    feeTotal += amt;
  }

  // ค่าชั่วโมงจาก Shiff
  const shiff = await fetchTable(SHIFF_TABLE,
    [SH_EMP, SH_DATE, SH_HOUR], `{${SH_DATE}} != ''`);
  const hoursByDay = new Map();
  let hourlyTotal = 0;
  for (const rec of shiff){
    const f = rec.fields;
    const day = String(f[SH_DATE] || '').slice(0, 10);
    if (!day || day < start || day > end) continue;
    if (!matchCode(f[SH_EMP], codes)) continue;
    const amt = parseMoney(f[SH_HOUR]);
    if (!amt) continue;
    hoursByDay.set(day, (hoursByDay.get(day) || 0) + amt);
    hourlyTotal += amt;
  }

  // ยอดร้านรวม (จอง/ซื้อคอร์ส ผ่านช่องทางบริษัท)
  const billing = await fetchBillingPaid();
  let shopTotal = 0;
  for (const rec of billing){
    const f = rec.fields;
    const day = String(f[B_DATE] || '').slice(0, 10);
    if (!day || day < start || day > end) continue;
    const type = String(f[B_TYPE] || '').trim();
    if (type !== 'จอง' && type !== 'ซื้อคอร์ส') continue;
    if (!PAY_OK.has(String(f[B_PAY] || '').trim())) continue;
    shopTotal += parseMoney(f[B_FINAL]);
  }

  let html = bigNum([
    [thBaht(feeTotal), 'ค่ามือ (บาท)'],
    [thBaht(hourlyTotal), 'ค่าชั่วโมง (บาท)'],
    [thBaht(allDoctorTotal), 'ค่ามือรวมหมอทุกคน'],
    [thBaht(shopTotal), 'ยอดร้านรวม']
  ]);

  const days = [...new Set([...feesByDay.keys(), ...hoursByDay.keys()])].sort();
  let rows = '';
  for (const day of days){
    rows += `<tr><td>${thDate(day)}</td>
      <td class="num">${thBaht(feesByDay.get(day) || 0)}</td>
      <td class="num">${thBaht(hoursByDay.get(day) || 0)}</td></tr>`;
  }
  html += tableCard(
    `<tr><th>วันที่</th><th class="num">ค่ามือ</th><th class="num">ค่าชั่วโมง</th></tr>`,
    rows, 3,
    `<tr class="total"><td>รวมทั้งช่วง</td>
     <td class="num">${thBaht(feeTotal)}</td>
     <td class="num">${thBaht(hourlyTotal)}</td></tr>`);
  html += `<div class="note">* แสดงผลอย่างเดียว ไม่เขียนสรุปกลับลงฟิลด์ใน Airtable</div>`;
  return html;
}

/* ====== RENDER HELPERS ====== */
function bigNum(pairs){
  return `<div class="card"><div class="bignum">` +
    pairs.map(([v, l]) => `<div class="box"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('') +
    `</div></div>`;
}
function tableCard(head, rows, cols, totalRow){
  return `<div class="card"><div class="tscroll"><table>${head}` +
    (rows || `<tr><td colspan="${cols}" style="text-align:center;color:#999">ไม่มีรายการในช่วงที่เลือก</td></tr>`) +
    totalRow + `</table></div></div>`;
}
function groupByDay(bills){
  const m = new Map();
  for (const b of bills){
    if (!m.has(b.day)) m.set(b.day, []);
    m.get(b.day).push(b);
  }
  return m;
}

/* ====== RUN ====== */
const RUNNERS = {
  bookings: reportBookings,
  chat: reportChat,
  pa: reportPA,
  sale: reportSale,
  bt: reportBT,
  doctor: reportDoctor
};

async function run(){
  const u = session();
  if (!u){ logout(); return; }
  const key = document.getElementById('reportSel').value;
  if (!allowedReports(u).includes(key)){ alert('ไม่มีสิทธิ์ดูรายงานนี้'); return; }

  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const st = document.getElementById('status');
  const isBookings = key === 'bookings';
  if (!isBookings && (!start || !end)){ alert('กรุณาเลือกวันที่เริ่มและสิ้นสุด'); return; }

  // Mgn/Dev เลือกพนักงานได้ / คนอื่นดูของตัวเองเท่านั้น
  let codes = u.codes, empLabel = u.name;
  if (isManager(u) && !isBookings){
    const picked = document.getElementById('empPick').value.trim();
    if (picked){
      const code = resolveEmp(picked);
      codes = [code]; empLabel = picked;
    }
    else if (!codes.length){
      alert('กรุณาเลือกหรือพิมพ์ Emp code ของพนักงานที่ต้องการดู'); return;
    }
  }

  st.className = ''; st.textContent = 'กำลังดึงข้อมูล...';
  document.getElementById('result').innerHTML = '';
  try {
    const html = await RUNNERS[key](codes, start, end);
    st.textContent = 'คำนวณเสร็จแล้ว';
    document.getElementById('printTitle').textContent = isBookings
      ? REPORTS[key].name
      : REPORTS[key].name + ' — ' + empLabel + ' (' + codes.join(', ') + ')';
    document.getElementById('printRange').textContent = isBookings
      ? 'บิลจองทุกช่วงวันที่ · สถานะจากฟิลด์ Used?'
      : `ช่วงวันที่ ${thDate(start)} – ${thDate(end)}`;
    document.getElementById('result').innerHTML = html;
  } catch (e){
    st.className = 'err'; st.textContent = '❌ ' + e.message;
  }
}
